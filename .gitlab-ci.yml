# GitLab CI —— 由 .github/workflows/ci.yml 平移（GitHub Actions → 内网 GitLab）
# runner：wqc-server-dell 的 docker executor（tag wqc）
#
# ⚠️⚠️ 为什么不用 GIT_SUBMODULE_STRATEGY: recursive ⚠️⚠️
#   docker executor 下 runner 的 git 操作（含 submodule 克隆）跑在 **helper 容器**里，
#   而 gitlab/gitlab-runner-helper 镜像 **没有 ssh 二进制**（实测：git 2.54.0 / ssh MISSING），
#   且它的 global gitconfig 是空的 —— 因此：
#     · 任何 ssh:// 或 git@host: 形式的 submodule URL 必然 "cannot run ssh" 失败
#     · runner 侧 pre_clone_script 里设的 insteadOf 对 helper 容器无效
#   解法：让 runner 别碰 submodule（none），在 before_script 里自己初始化 ——
#   before_script 跑在 **job 容器**内，那里有 git + ssh，global gitconfig 也是我们自己的。
#
# ⚠️ 不用 GitLab CI cache：runner 侧已有 /srv/gitlab-runner-cache/m2 挂到 /root/.m2，
#    且历史上 self-hosted 缓存上传触发过故障（对齐端仓结论 ae0feb0）
stages:
  - test
  - release

# main 已设为受保护分支（push_access_level=0，无人可直推）→ 一律走 特性分支 + MR。
# 没有这段 workflow 时，推特性分支会生成一个「0 job」的空 pipeline；
# 分支与 MR 并存时还会重复跑两遍。
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

variables:
  GIT_SUBMODULE_STRATEGY: none
  GIT_DEPTH: 0

default:
  tags: [wqc]

# —— 后端：framework submodule + backend 聚合构建 ——
backend:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  timeout: 45m
  before_script:
    # GitHub 侧（嵌套 38 条仍指 git@github.com:）→ 匿名 HTTPS：那些仓是公开仓
    - git config --global url."https://github.com/".insteadOf "git@github.com:"
    # GitLab 侧（本仓顶层 10 条是 ssh://…:22220/…）→ 用 CI_JOB_TOKEN 走 HTTPS
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.ts.huntercat.cn/".insteadOf "ssh://git@gitlab.ts.huntercat.cn:22220/"
    - git submodule sync --recursive
    - git submodule update --init --recursive
    # 内网 Nexus 由 Caddy 内部 CA 签发，而 job 容器的 JVM 不信任它（cacerts 里没有 caddy）
    # → 依赖源已在仓内 .mvn/settings.xml 固定为 Nexus；这里补 JVM 信任库
    - test -f /root/.m2/caddy-root.crt || { echo "❌ 缺少 CA：/root/.m2/caddy-root.crt（应由 runner 挂载的 m2 卷提供）"; exit 1; }
    - JH=$(dirname $(dirname $(readlink -f $(command -v java)))) && keytool -importcert -noprompt -alias caddy-root -file /root/.m2/caddy-root.crt -keystore "$JH/lib/security/cacerts" -storepass changeit
    # 断言依赖源真的是内网 Nexus（不是悄悄回退到公网 central）
    - mvn -B -ntp help:effective-settings -Doutput=/tmp/eff-settings.xml -q
    - grep -q "nexus.ts.huntercat.cn/repository/maven-public" /tmp/eff-settings.xml && echo "✅ 依赖源 = 内网 Nexus maven-public"
  script:
    - java -version
    - mvn -B -ntp -f pom.xml verify
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# —— 前端：自动装配 → 依赖 → 类型检查 ——
# 用 bookworm 全量镜像而非 slim：slim 里没有 git，submodule 初始化需要它
frontend:
  stage: test
  image: node:22-bookworm
  timeout: 45m
  before_script:
    - git config --global url."https://github.com/".insteadOf "git@github.com:"
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.ts.huntercat.cn/".insteadOf "ssh://git@gitlab.ts.huntercat.cn:22220/"
    - git submodule sync --recursive
    - git submodule update --init --recursive
  script:
    - node -v
    # 必须先 corepack enable（安装 shim 到 PATH）；只 prepare --activate 不会让 pnpm 可执行
    - corepack enable && corepack prepare pnpm@9.12.0 --activate
    - pnpm -v
    - node scripts/prepare.mjs
    - pnpm install --no-frozen-lockfile --force
    - |
      for app in admin desktop mobile mini-program; do
        if [ -f "apps/$app/pnpm-workspace.yaml" ]; then
          (cd "apps/$app" && pnpm install --no-frozen-lockfile --force)
        fi
      done
    - (cd apps/admin && pnpm typecheck)
    - (cd apps/desktop && pnpm typecheck)
    - (cd apps/mini-program && pnpm typecheck)
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# —— 组合发布（tag v* 触发；在分支上不触发即为惰性）——
# ⚠️ maven 镜像含 JDK21 + mvn + git，但**没有 Node**（也没有 xz，故只能取 .tar.gz），下面自装
# ⚠️ job 级 before_script 会覆盖 default，所以这里要把 submodule 那套也重复一遍
release:
  stage: release
  image: maven:3.9-eclipse-temurin-21
  timeout: 90m
  before_script:
    - git config --global url."https://github.com/".insteadOf "git@github.com:"
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.ts.huntercat.cn/".insteadOf "ssh://git@gitlab.ts.huntercat.cn:22220/"
    - git submodule sync --recursive
    - git submodule update --init --recursive
    - test -f /root/.m2/caddy-root.crt || { echo "❌ 缺少 CA：/root/.m2/caddy-root.crt"; exit 1; }
    - JH=$(dirname $(dirname $(readlink -f $(command -v java)))) && keytool -importcert -noprompt -alias caddy-root -file /root/.m2/caddy-root.crt -keystore "$JH/lib/security/cacerts" -storepass changeit
    - mvn -B -ntp help:effective-settings -Doutput=/tmp/eff-settings.xml -q
    - grep -q "nexus.ts.huntercat.cn/repository/maven-public" /tmp/eff-settings.xml && echo "✅ 依赖源 = 内网 Nexus maven-public"
    - curl -fsSL -o /tmp/node.tar.gz https://registry.npmmirror.com/-/binary/node/v22.23.2/node-v22.23.2-linux-x64.tar.gz
    - tar -xzf /tmp/node.tar.gz -C /usr/local --strip-components=1
    - node -v
    - corepack enable && corepack prepare pnpm@9.12.0 --activate
    - pnpm -v
  script:
    - ./scripts/release.sh --with-mini --with-mobile
    - PKG_BASE="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/lieshouboot/${CI_COMMIT_TAG}"
    - |
      for f in dist/lieshouboot-release/backend/*.jar dist/lieshouboot-release/README.md; do
        echo "上传 $(basename "$f")"
        curl -sS --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$f" "${PKG_BASE}/$(basename "$f")"
      done
    - tar czf "lieshouboot-${CI_COMMIT_TAG}.tar.gz" -C dist lieshouboot-release
    - |
      curl -sS --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "lieshouboot-${CI_COMMIT_TAG}.tar.gz" \
        "${PKG_BASE}/lieshouboot-${CI_COMMIT_TAG}.tar.gz"
    - |
      curl -sS --fail --request POST \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "{\"name\":\"LieShouBoot ${CI_COMMIT_TAG}\",\"tag_name\":\"${CI_COMMIT_TAG}\",\"assets\":{\"links\":[{\"name\":\"组合发布包\",\"url\":\"${PKG_BASE}/lieshouboot-${CI_COMMIT_TAG}.tar.gz\",\"link_type\":\"package\"}]}}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
